# Static site — nothing to build, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# Long cache for fingerprint-free static assets is risky, so keep images at a
# day and let HTML always revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# "/*" so the rule also matches "/" — a "/*.html" pattern never fires on the
# root URL even though the root serves index.html.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# HTML must always revalidate so a redeploy is picked up immediately.
# Declared after "/*" — the more specific path wins for Cache-Control.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Send the bare domain to www (or flip this in Netlify's domain settings if
# you would rather serve the apex).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = false
